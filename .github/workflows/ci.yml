name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm install
      - name: Generated Worker types are fresh (wrangler types)
        run: |
          npm run gen:types
          git diff --exit-code worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Tests + production parity gate
        run: npx vitest run
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm install
      - run: npm run build
      # Strict bundle smoke: validate wrangler.jsonc and the full worker
      # bundle without credentials. A failure fails the job.
      - name: Bundle smoke (wrangler dry run, no credentials)
        run: npx wrangler deploy --dry-run --outdir dist-worker
